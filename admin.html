<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f1f1f1;
        }
        .box {
            width: 500px;
            margin: 60px auto;
            background: white;
            padding: 20px;
            border: 1px solid #ccc;
        }
        input, button {
            padding: 8px;
            width: 100%;
            margin-top: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #aaa;
            padding: 8px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>Admin Login</h2>

    <input type="password" id="password" placeholder="Enter admin password">
    <button onclick="login()">Login</button>

    <div id="data"></div>
</div>

<script>
    const ADMIN_PASSWORD = "licet123";  // change this

    function login() {
        let pass = document.getElementById("password").value;

        if (pass === ADMIN_PASSWORD) {
            showData();
        } else {
            alert("Access Denied");
        }
    }

    function showData() {
        let students = JSON.parse(localStorage.getItem("students")) || [];

        if (students.length === 0) {
            document.getElementById("data").innerHTML = "No data available";
            return;
        }

        let table = "<table><tr><th>Name</th><th>Roll No</th><th>DOB</th></tr>";

        students.forEach(s => {
            table += `<tr>
                        <td>${s.name}</td>
                        <td>${s.roll}</td>
                        <td>${s.dob}</td>
                      </tr>`;
        });

        table += "</table>";

        document.getElementById("data").innerHTML = table;
    }
</script>

</body>
</html>
